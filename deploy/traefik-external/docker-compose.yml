# Devitri — backend + frontend behind an existing Traefik (external network).
#
# From repository root:
#   cp .env.example .env   # set hosts, secrets, CORS (see below)
#   docker compose -f deploy/traefik-external/docker-compose.yml up -d --build
#
# Required in .env (hostnames only, no scheme):
#   DEVITRI_API_HOST=api.example.com
#   DEVITRI_WEB_HOST=devitri.example.com
#
# Required for frontend build (full public API URL, with https://):
#   DEVITRI_BACKEND_URL=https://api.example.com
#
# CORS (browser dashboard): include the dashboard origin, e.g.
#   DEVITRI_CORS_ORIGINS=https://devitri.example.com
#
# Optional Traefik overrides (defaults shown):
#   DEVITRI_TRAEFIK_NETWORK=traefik
#   DEVITRI_TRAEFIK_ENTRYPOINT=websecure
#   DEVITRI_TRAEFIK_CERT_RESOLVER=letsencrypt

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    volumes:
      - devitri-data:/data
      - devitri-vaults:/vaults
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DEVITRI_TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.devitri-api.rule=Host(`${DEVITRI_API_HOST:?set DEVITRI_API_HOST in .env}`)
      - traefik.http.routers.devitri-api.entrypoints=${DEVITRI_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.devitri-api.tls.certresolver=${DEVITRI_TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.devitri-api.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_DEVITRI_BACKEND_URL: ${DEVITRI_BACKEND_URL:?set DEVITRI_BACKEND_URL in .env (e.g. https://api.example.com)}
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DEVITRI_TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.devitri-web.rule=Host(`${DEVITRI_WEB_HOST:?set DEVITRI_WEB_HOST in .env}`)
      - traefik.http.routers.devitri-web.entrypoints=${DEVITRI_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.devitri-web.tls.certresolver=${DEVITRI_TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.devitri-web.loadbalancer.server.port=80
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  devitri-data:
  devitri-vaults:

networks:
  traefik-proxy:
    external: true
    name: ${DEVITRI_TRAEFIK_NETWORK:-traefik}
