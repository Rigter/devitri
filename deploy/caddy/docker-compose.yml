# Devitri — Caddy reverse proxy + backend + frontend (greenfield install).
# From repository root:
#   cp .env.example .env
#   docker compose -f deploy/caddy/docker-compose.yml up -d --build
#
# HTTP (:80): default Caddyfile. HTTPS: see Caddyfile.production.example and README.md.

services:
  caddy:
    image: caddy:2.7-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      DEVITRI_DOMAIN: ${DEVITRI_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    volumes:
      - ../../data:/data
      - ../../vaults:/vaults
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_DEVITRI_BACKEND_URL: ${DEVITRI_BACKEND_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
