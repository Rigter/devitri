# Devitri — generic Docker Compose.
#
# Quick start:
#   cp .env.example .env          # fill in secrets (see .env.example)
#   docker compose up -d --build
#
# Ports 8080 (API) and 3000 (dashboard) are exposed directly.
# To put a reverse proxy (Traefik, Caddy, Nginx…) in front, remove the
# `ports:` blocks and add your proxy labels / networks to each service.
# The backend listens on port 8080 internally; the frontend on port 80.
#
# VITE_DEVITRI_BACKEND_URL is baked into the frontend at build time.
# For local use the default (http://localhost:8080) works as-is.
# For a public deployment set it to your API's public URL before building:
#   VITE_DEVITRI_BACKEND_URL=https://api.example.com docker compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - devitri-data:/data
      - devitri-vaults:/vaults
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEVITRI_BACKEND_URL: ${VITE_DEVITRI_BACKEND_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  devitri-data:
  devitri-vaults:
